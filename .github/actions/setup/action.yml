name: Set up project
description: Install the pinned Poetry version and the locked project dependencies.
inputs:
  python-version:
    description: Python version to install.
    required: true
runs:
  using: composite
  steps:
    - name: Set up Python
      uses: actions/setup-python@e797f83bcb11b83ae66e0230d6156d7c80228e7c # v6.0.0
      with:
        python-version: ${{ inputs.python-version }}
    - name: Install Poetry
      shell: bash
      run: python -m pip install poetry==2.2.1
    - name: Validate metadata and lock file
      shell: bash
      run: poetry check --lock --strict
    - name: Install locked dependencies
      shell: bash
      run: poetry sync --no-interaction
