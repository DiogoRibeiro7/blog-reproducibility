name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  # No branch filter: the migration is reviewed as a stack of pull requests,
  # and one whose base is another feature branch still has to be checked.
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  MPLBACKEND: Agg
  PYTHONUTF8: "1"
  PIP_DISABLE_PIP_VERSION_CHECK: "1"

jobs:
  quality:
    name: Code quality
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
        with:
          python-version: "3.11"
      - name: Lint GitHub Actions workflows
        run: poetry run pre-commit run actionlint --all-files
      - name: Validate release metadata
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: poetry run python -m scripts.check_release --tag "$RELEASE_TAG"
      - name: Check lint and formatting
        run: |
          poetry run ruff check .
          poetry run ruff format --check .
      - name: Check types
        run: poetry run mypy src scripts tests
      - name: Validate article manifest
        run: poetry run python -m scripts.reproduce --check
      - name: Check generated article catalog
        run: poetry run python -m scripts.catalog --check

  tests:
    name: Tests / ${{ matrix.os }} / Python ${{ matrix.python-version }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        python-version: ["3.11", "3.12", "3.13", "3.14"]
        include:
          - os: windows-latest
            python-version: "3.13"
          - os: macos-latest
            python-version: "3.13"
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
        with:
          python-version: ${{ matrix.python-version }}
      - name: Run tests with coverage
        run: poetry run pytest -n auto --cov --cov-report=term-missing --cov-report=xml
      - name: Save coverage report
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: coverage-${{ matrix.os }}-${{ matrix.python-version }}
          path: coverage.xml
          if-no-files-found: error
          retention-days: 14

  distribution:
    name: Build and reproduce
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
        with:
          python-version: "3.13"
      - name: Prepare release notes
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: >-
          poetry run python -m scripts.check_release
          --tag "$RELEASE_TAG" --notes-output build/release-notes.md
      - name: Build wheel and source distribution
        run: poetry build
      - name: Verify wheel installation and rebuild from the source archive
        run: poetry run python scripts/check_distribution.py
      - name: Reproduce every registered article
        run: poetry run python -m scripts.reproduce
      - name: Verify saved figure checksums
        run: poetry run python -m scripts.verify_reproduction build/figures/reproduction.json
      - name: Package a verified reproducibility snapshot
        run: poetry run python -m scripts.package_snapshot
      - name: Verify the extracted snapshot with its bundled command
        run: |
          python -m zipfile -e build/snapshots/reproducibility-snapshot.zip build/snapshot-review
          python -I -S build/snapshot-review/verify_checksums.py build/snapshot-review/SHA256SUMS
      - name: Save distributions and reproduction artifacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: distributions-and-figures
          path: |
            dist/
            build/figures/
            build/snapshots/
            build/release-notes.md
          if-no-files-found: error
          retention-days: 14

  release:
    name: Publish GitHub release
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    needs: [quality, tests, distribution]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      actions: read
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      RELEASE_TAG: ${{ github.ref_name }}
    steps:
      - name: Download this run's verified snapshot and release notes
        run: >-
          gh run download "$GITHUB_RUN_ID" --repo "$GITHUB_REPOSITORY"
          --name distributions-and-figures --dir release-assets
      - name: Publish the release
        run: >-
          gh release create "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY"
          --verify-tag --title "$RELEASE_TAG"
          --notes-file release-assets/build/release-notes.md
          release-assets/build/snapshots/reproducibility-snapshot.zip
