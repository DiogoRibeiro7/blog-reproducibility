name: CI

on:
  push:
    branches: [main]
  # No branch filter: the migration is reviewed as a stack of pull requests,
  # and one whose base is another feature branch still has to be checked.
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  MPLBACKEND: Agg
  PYTHONUTF8: "1"
  PIP_DISABLE_PIP_VERSION_CHECK: "1"

jobs:
  quality:
    name: Code quality
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
        with:
          python-version: "3.11"
      - name: Check lint and formatting
        run: |
          poetry run ruff check .
          poetry run ruff format --check .
      - name: Check types
        run: poetry run mypy src scripts tests
      - name: Validate article manifest
        run: poetry run python -m scripts.reproduce --check
      - name: Check generated article catalog
        run: poetry run python -m scripts.catalog --check

  tests:
    name: Tests / ${{ matrix.os }} / Python ${{ matrix.python-version }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        python-version: ["3.11", "3.12", "3.13", "3.14"]
        include:
          - os: windows-latest
            python-version: "3.13"
          - os: macos-latest
            python-version: "3.13"
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
        with:
          python-version: ${{ matrix.python-version }}
      - name: Run tests with coverage
        run: poetry run pytest --cov --cov-report=term-missing --cov-report=xml
      - name: Save coverage report
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: coverage-${{ matrix.os }}-${{ matrix.python-version }}
          path: coverage.xml
          if-no-files-found: error
          retention-days: 14

  distribution:
    name: Build and reproduce
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
        with:
          python-version: "3.13"
      - name: Build wheel and source distribution
        run: poetry build
      - name: Verify isolated wheel installation and source archive
        run: poetry run python scripts/check_distribution.py
      - name: Reproduce every registered article
        run: poetry run python -m scripts.reproduce
      - name: Verify saved figure checksums
        run: poetry run python -m scripts.verify_reproduction build/figures/reproduction.json
      - name: Package a verified reproducibility snapshot
        run: poetry run python -m scripts.package_snapshot
      - name: Save distributions and reproduction artifacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: distributions-and-figures
          path: |
            dist/
            build/figures/
            build/snapshots/
          if-no-files-found: error
          retention-days: 14
