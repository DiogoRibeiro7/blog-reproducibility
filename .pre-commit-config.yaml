default_install_hook_types: [pre-commit, pre-push]

repos:
  - repo: https://github.com/rhysd/actionlint
    rev: 914e7df21a07ef503a81201c76d2b11c789d3fca # frozen: v1.7.12
    hooks:
      - id: actionlint
        # Check every workflow when workflows, local actions, or this config change.
        files: ^(\.github/(workflows|actions)/.*\.ya?ml|\.pre-commit-config\.yaml)$
        pass_filenames: false
        # Keep checks consistent without optional system-installed linters.
        args: [-shellcheck=, -pyflakes=]
        stages: [pre-commit]

  - repo: local
    hooks:
      - id: poetry-check
        name: Check metadata and lock file
        entry: poetry check --lock --strict
        language: system
        files: ^(pyproject\.toml|poetry\.lock)$
        pass_filenames: false
        stages: [pre-commit]

      - id: ruff-check
        name: ruff check
        entry: poetry run ruff check .
        language: system
        types_or: [python, pyi]
        pass_filenames: false
        stages: [pre-commit]

      - id: ruff-format
        name: ruff format
        entry: poetry run ruff format --check .
        language: system
        types_or: [python, pyi]
        pass_filenames: false
        stages: [pre-commit]

      - id: mypy
        name: mypy
        entry: poetry run mypy src scripts tests
        language: system
        types_or: [python, pyi]
        pass_filenames: false
        stages: [pre-commit]

      - id: article-manifest
        name: Validate article manifest
        entry: poetry run python -m scripts.reproduce --check
        language: system
        pass_filenames: false
        always_run: true
        stages: [pre-commit]

      - id: pytest
        name: pytest
        entry: poetry run pytest --cov --cov-report=term-missing
        language: system
        pass_filenames: false
        always_run: true
        stages: [pre-push]

      - id: article-catalog
        name: Check generated article catalog
        entry: poetry run python -m scripts.catalog --check
        language: system
        pass_filenames: false
        files: ^(articles/|docs/articles\.md|scripts/(catalog|manifest)\.py)
        stages: [pre-commit]
